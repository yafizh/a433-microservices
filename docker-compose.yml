# Gunakan Docker Compose file format versi 3 (memenuhi syarat versi 2 atau lebih)
version: "3"

# Definisi service yang akan dijalankan
services:
  # Service aplikasi item-app
  item-app:
    # Gunakan image item-app dari GitHub Packages
    image: ghcr.io/yafizh/item-app:v1
    # Petakan port 80 di host ke port 8080 di container
    ports:
      - "80:8080"
    # Pastikan item-app hanya berjalan setelah item-db diluncurkan dan siap menerima koneksi
    depends_on:
      item-db:
        condition: service_healthy
    # Selalu restart container ketika terhenti
    restart: always

  # Service database item-db
  item-db:
    # Gunakan image mongo:3 dari Docker Hub
    image: mongo:3
    # Gunakan volume app-db dengan target /data/db di container
    volumes:
      - app-db:/data/db
    # Cek kesehatan MongoDB dengan perintah ping agar item-app menunggu hingga database siap
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Selalu restart container ketika terhenti
    restart: always

# Definisi volume yang digunakan oleh service
volumes:
  # Volume bernama app-db untuk menyimpan data MongoDB secara persisten
  app-db:
